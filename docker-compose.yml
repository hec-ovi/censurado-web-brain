# =============================================================================
# censurado: the whole Censurado system in one compose.
#
# This repo IS the newsroom (the agentic CLI + the prompt recipe + this compose).
# The build contexts point at the sibling CODE repos (../censurado-web,
# ../censurado-web-backend, ../comfyui-strix-docker); nothing here re-implements
# them, it only composes their existing Dockerfiles and pins the cross-service wiring.
#
# Data flow:
#   a CLI agent --POST /articles--> publish (the only writer) -> sqlite -> generate
#   -> site-data -> site (public nginx). The backend owns ALL content data (authors,
#   sources, articles, layout) AND serves the operator admin panel; the CLI agent reads
#   authors/sources from it and the newsroom recipe (the workflow/persona prompts) from
#   this repo's prompts/ files on the host. Hero images render on comfyui; nothing
#   infers in-process.
#
# The ONE cross-service secret is a single operator token: a publish key minted with
# three scopes (articles:write + articles:publish-any + admin:write). ./bootstrap.sh
# mints it, seeds keys.json, and writes it into .env. Run that first (or `./run.sh start`,
# which does it for you on first run), then `docker compose up -d` (the fast lane:
# publish/generate/site). comfyui is heavy + GPU-only, so it is OPT-IN behind the
# `comfyui` profile: add it with `docker compose --profile comfyui up -d` (or
# `./run.sh up-gpu`); nothing in the fast lane waits on it. ./run.sh needs only bash +
# docker (no make); the Makefile just mirrors it.
#
# Host ports: the public news site is the only 0.0.0.0 surface (SITE_PORT, 8080).
# Everything operational (publish API, operator panel, ComfyUI) binds 127.0.0.1 only.
# Reach those over the host or an SSH tunnel.
#
# GPU: comfyui needs an AMD Strix Halo box (gfx1151) with ROCm (privileged +
# /dev/kfd) to render hero images. The rest of the stack is plain HTTP, no GPU need.
# =============================================================================

name: censurado

services:
  # --- comfyui: ROCm image generation, the CLI agent's image backend -------------
  # The CLI agent (cli/censurado.py image) reaches it at 127.0.0.1:8188 to render a
  # FLUX.2 klein hero image per article. From comfyui-strix-docker.
  comfyui:
    # Heavy (ROCm init, model load) and GPU-only, so it is OPT-IN: gated behind the
    # `comfyui` compose profile. A plain `docker compose up` / `./run.sh up` brings up
    # only the fast lane (publish/generate/site); add comfyui with `--profile comfyui`
    # (or `./run.sh up-gpu`), which starts it alongside without the fast lane waiting on it.
    profiles: ["comfyui"]
    build:
      context: ../comfyui-strix-docker
    image: comfyui-strix-halo:latest
    container_name: censurado-comfyui
    privileged: true               # ROCm needs broad device access
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-990}"
    ports:
      # Internal tool, localhost-only like the other operational surfaces.
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"
    volumes:
      - ${COMFYUI_MODELS_PATH:-/home/hec/models/comfyui}:/app/ComfyUI/models
      - comfyui-output:/app/ComfyUI/output
      - comfyui-user:/app/ComfyUI/user
      - comfyui-cache:/root/.cache
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.5.1
      - HIP_VISIBLE_DEVICES=0
    ipc: host
    security_opt:
      - seccomp:unconfined
    networks: [censurado]

  # --- publish: the censurado-web-backend write API, the ONLY sqlite writer -----
  # Authenticated POST /articles + GET /healthz. From censurado-web-backend. It no
  # longer regenerates the static site in-process (that moved to the generate
  # watcher below); publish only writes the database + the media store now.
  publish:
    build:
      context: ../censurado-web-backend
      dockerfile: deploy/Dockerfile.publish
    image: censurado-publish:local
    container_name: censurado-publish
    restart: unless-stopped
    depends_on:
      # Wait for the one-shot that chowns ./data (db + media) to the writer uid.
      init-perms:
        condition: service_completed_successfully
    environment:
      CENSURADO_DB: /data/censurado.db
      CENSURADO_PUBLISH_KEYS_FILE: /etc/censurado/keys.json
      CENSURADO_BASE_URL: ${CENSURADO_BASE_URL:-http://localhost:8080}
      # Self-hosted image store: publish accepts POST /media (authed) and serves
      # GET /media/{name}. Bytes land on the persistent ./data/media bind mount,
      # which the public site also serves at /media/. Unset to disable media.
      CENSURADO_MEDIA_DIR: /srv/media
      # The operator admin panel is folded INTO this server (Go, go:embed SPA): with a
      # session key + login hash set, the same process serves the buildless SPA and its
      # signed-cookie login on this port beside the JSON API. A valid session maps to the
      # operator identity in-process, so no operator Bearer is injected and the panel needs
      # NO brain: it works with only this backend up. The clear token prefills the localhost
      # login form; the hash is what gates. Unset the key/hash to run a pure API (no panel).
      PANEL_SESSION_KEY: ${PANEL_SESSION_KEY:-}
      PANEL_LOGIN_TOKEN_HASH: ${PANEL_LOGIN_TOKEN_HASH:-}
      PANEL_LOGIN_TOKEN: ${PANEL_LOGIN_TOKEN:-}
      PANEL_SECURE_COOKIES: ${PANEL_SECURE_COOKIES:-false}
    volumes:
      # Persistent host bind mounts (survive `docker compose down -v`): the sqlite
      # source of truth and the uploaded images, owned by uid 65532 (init-perms).
      - ${CENSURADO_DATA_DIR:-./data}/db:/data
      - ${CENSURADO_DATA_DIR:-./data}/media:/srv/media
      # Seed as an empty JSON array FIRST (bootstrap.sh does this); a missing host
      # file makes Docker create a directory here and breaks startup.
      - ./keys.json:/etc/censurado/keys.json:ro
    ports:
      # Localhost-only: the authenticated JSON API AND the operator admin panel (SPA +
      # login) are both served here. NEVER 0.0.0.0. Reach the panel at http://127.0.0.1:8082/
      # over the host or an SSH tunnel.
      - "127.0.0.1:${PUBLISH_PORT:-8082}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    networks: [censurado]

  # --- init-perms: make the shared site volume + persistent data dirs writable ---
  # publish/generate run as the distroless nonroot user (uid 65532), but a fresh
  # site-data / gocache volume and freshly-created ./data bind mounts initialize
  # root-owned, so the first write fails with "permission denied". This one-shot
  # chowns the site + gocache volumes AND the persistent ./data bind mounts (db, media)
  # to 65532 so the writers succeed. It runs
  # FIRST on every `up` and the writers (publish, generate) wait on it via
  # service_completed_successfully, so `docker compose up -d` works from a clean clone
  # or right after `down -v` with no manual step. Owns no network, idempotent, exits 0.
  init-perms:
    image: busybox:1.37
    restart: "no"
    # mkdir keeps the site volume NON-EMPTY so the nginx `site` image cannot
    # repopulate it with its own root-owned default index.html on first mount
    # (which would clobber this ownership); then chown both to the writer uid.
    command: ["sh", "-c", "mkdir -p /site/.generated /gocache/tmp && chown -R 65532:65532 /site /data-host /gocache"]
    volumes:
      - site-data:/site
      - ${CENSURADO_DATA_DIR:-./data}:/data-host
      # The generate watcher runs as uid 65532 and writes its Go build/module cache
      # here; a fresh named volume is root-owned, so chown it to the writer too.
      - gocache-data:/gocache
    network_mode: none

  # --- generate: the static-site builder + freshness watcher --------------------
  # From censurado-web, which imports censurado-web-backend's shared libs via a
  # replace directive, so the toolchain container mounts BOTH repos for the replace
  # to resolve. It -watches the database and regenerates the static site (writing the
  # site-data volume nginx serves) whenever publish writes a new article, replacing
  # the in-process auto-regenerate publish did before the repo split. Runs as uid
  # 65532 (same as publish) so the shared DB WAL sidecars and the site volume stay
  # single-owner; init-perms chowns the gocache volume to 65532 too. First start
  # compiles + downloads the module graph once (slow), then watches.
  generate:
    # Alpine toolchain: ~360MB vs ~1.3GB for the Debian (trixie) image. The generator
    # and its deps are pure Go (modernc.org/sqlite, no cgo), so it compiles + watches
    # the same here. (The publish image still builds its shipped binary on trixie for
    # reproducibility; this watcher does not produce a released artifact.)
    image: golang:1.26.4-alpine@sha256:3ad57304ad93bbec8548a0437ad9e06a455660655d9af011d58b993f6f615648
    container_name: censurado-generate
    restart: unless-stopped
    depends_on:
      # The gocache + site volumes are named volumes: `down -v` wipes them, so a fresh
      # `up` recreates them root-owned. Wait for init-perms to chown them (this is the
      # fix for the "go: creating work dir: stat /gocache/tmp" crash-loop) before running.
      init-perms:
        condition: service_completed_successfully
      publish:
        condition: service_started
    user: "65532:65532"
    working_dir: /work/censurado-web
    environment:
      HOME: /gocache
      GOCACHE: /gocache/build
      GOMODCACHE: /gocache/mod
      # Pure-Go build (modernc.org/sqlite needs no cgo), so no C toolchain is required
      # on the alpine image. Force it off so a stray CC never flips the build to cgo.
      CGO_ENABLED: "0"
      # go run compiles to a temp dir and EXECUTES it; keep that on the gocache
      # volume because the container's tmpfs /tmp is mounted noexec.
      GOTMPDIR: /gocache/tmp
      CENSURADO_DB: /data/censurado.db
      CENSURADO_BASE_URL: ${CENSURADO_BASE_URL:-http://localhost:8080}
    command: ["go", "run", "./cmd/censurado/generate", "-out", "/site", "-page-size", "6", "-watch", "-watch-interval", "2s"]
    volumes:
      - ../censurado-web:/work/censurado-web:ro
      - ../censurado-web-backend:/work/censurado-web-backend:ro
      - ${CENSURADO_DATA_DIR:-./data}/db:/data
      - site-data:/site
      - gocache-data:/gocache
    networks: [censurado]

  # --- site: the public static news portal --------------------------------------
  # The one public surface. censurado-web deliberately leaves this to an external
  # web server; this compose includes a tiny nginx so the whole thing is viewable.
  # Serves the site-data volume (populated by the generate watcher, or `make generate`).
  site:
    image: nginx:1.27-alpine
    container_name: censurado-site
    restart: unless-stopped
    depends_on: [publish]
    volumes:
      - site-data:/usr/share/nginx/html:ro
      # Serve uploaded images at /media/ from the same persistent store publish
      # writes to. Mounted OUTSIDE the read-only html root (you cannot create a
      # mountpoint inside a read-only volume); nginx maps /media/ here via alias.
      - ${CENSURADO_DATA_DIR:-./data}/media:/srv/media:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${SITE_PORT:-8080}:80"
    networks: [censurado]

  # There is no Telegram service: the bot lane is the telegram-bot-skill sibling checkout,
  # run on the HOST by the serve loop (`./run.sh serve`, automation/supervisor/), because
  # the agent CLIs and their auth live on the host. The old in-container tg-bridge retired
  # with automation/supervisor/REQUIREMENTS.md R7.

  # There is no config-plane service: the newsroom is a stateless agentic CLI run on the
  # HOST (python3 cli/censurado.py), living in THIS repo alongside this compose. It reads
  # authors/sources from the publish backend over HTTP and the newsroom recipe
  # (workflow/persona prompts) from this repo's prompts/ files, so no extra container and no
  # separate database are needed here.

networks:
  censurado:
    driver: bridge

volumes:
  # The sqlite db and the /media images live on PERSISTENT host bind mounts under
  # ./data (see the services above), so `docker compose down -v` cannot wipe the
  # authors and articles. Only derived/cache state is a volume.
  site-data:      # generated static site (derived; rebuilt from the db): served by site
  gocache-data:   # the generate watcher's Go build + module cache (derived)
  comfyui-output: # comfyui generated images
  comfyui-user:   # comfyui user settings / workflows
  comfyui-cache:  # comfyui (uv / hf) cache
