# Run the brain on its own. The brain runs no model: it is the newsroom config plane,
# serving the authors, sources, prompts, and editorial style over HTTP to a CLI agent
# that does the writing (and, in the full stack, to the harness operator panel).
#
# The brain is UNAUTHENTICATED and has state-changing POSTs, so it is published on
# 127.0.0.1 only. Reach it on the host or an SSH tunnel; put an auth layer in front
# before exposing it off-box.
#
# Quick start (from this directory):
#   cp .env.example .env          # then set NEWSROOM_OPERATOR_TOKEN and the URLs
#   docker compose up --build     # brain on http://127.0.0.1:8000

services:
  brain:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # In-container paths: the SQLite lives on a named volume, prompts in the image.
      NEWSROOM_PERSONA_DB_PATH: /data/personas.db
      NEWSROOM_PROMPTS_DIR: /app/prompts
    volumes:
      - brain-data:/data
    extra_hosts:
      # The publish target is the host platform, reached as host.docker.internal (the
      # default in .env.example). Docker Desktop populates that name automatically;
      # Docker Engine on Linux does not, so map it to the host gateway explicitly. This
      # spelling is honored on Linux and tolerated on Desktop, so the default works on both.
      - "host.docker.internal:host-gateway"
    ports:
      # Localhost-only: the config plane is unauthenticated, so NEVER bind 0.0.0.0.
      - "127.0.0.1:8000:8000"
    healthcheck:
      # No curl in the slim image; use the interpreter that is already there.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  brain-data:
