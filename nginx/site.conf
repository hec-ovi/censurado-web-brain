# Public static news portal. The generator writes article pages as
# a/<slug>-<hash>/index.html and listing pages as <scope>/page/<n>/index.html, so a
# plain directory-index server is all that is needed. Read-only volume, no upstream.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Keep redirects relative so the published host:port (e.g. :8080) is preserved
    # instead of nginx rebuilding an absolute URL that drops the mapped port.
    absolute_redirect off;

    # The generator's front page is the "latest" landing (latest/index.html); it
    # does not emit a root index.html. Send the bare site root there so the public
    # main page works at the origin, not just at /latest/.
    location = / {
        return 302 /latest/;
    }

    # Uploaded hero images, content-addressed (/media/<sha256>.<ext>), served from
    # the persistent store publish writes (mounted at /srv/media). Immutable: the
    # filename is the content hash so it never changes, cache it hard (matches
    # deploy/CACHING.md). alias maps /media/foo -> /srv/media/foo.
    location /media/ {
        alias /srv/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML, CSS, JS and the JSON shards live at stable (non-hashed) URLs with mutable
    # bytes, so a browser must refetch them after a publish/deploy. "no-store" (not
    # "no-cache") because iOS WebKit (Safari, and Brave/Chrome on iOS, which are all
    # WebKit) does NOT reliably revalidate "no-cache" on reload: it serves a stale disk
    # copy, so the phone shows old articles even after a manual refresh. "no-store" is
    # the only directive iOS honors; it forces a fresh fetch every time. The cost is one
    # extra round trip per HTML/JSON load, which is nothing for a news portal, and the
    # payoff is a portal that is actually current on mobile. Only /media/
    # (content-addressed, immutable filenames) stays cached hard above.
    # Unknown routes serve the generator's styled /404.html (site root) instead of
    # nginx's default plain "404 Not Found / nginx" page, keeping the 404 status.
    # try_files below returns =404 for a miss, which triggers this error_page; the
    # response body is the styled page while the status stays 404 (never a 200). The
    # Cloudflare Pages cloud deploy serves the same root 404.html by convention, so
    # both layers show the identical page. "no-store" matches the site's HTML policy.
    error_page 404 /404.html;
    location = /404.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
    }
}
