[project]
name = "censurado-web-brain"
version = "0.0.0"
description = "The Censurado agentic newsroom: a CLI plus a prompt recipe that drives the censurado-web-backend over HTTP (write articles, curate authors and sources) with maintenance sweeps (topic cleanse, embeds recheck). Holds no data, runs no server or model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Censurado" }]
dependencies = [
    "dbos>=2.29",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
# The newsroom maintenance CLI: a backend health probe plus the topic-cleanse and
# embeds-recheck sweeps over the platform backend. See newsroom.cli. (Article authoring
# is the dependency-free cli/censurado.py, run as a script.)
censurado-brain = "newsroom.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "newsroom",
    "newsroom.contracts",
    "newsroom.cleanse",
    "newsroom.embeds",
]

[tool.setuptools.package-data]
"newsroom.contracts" = ["vendored/v1/*.json", "vendored/v1/*.md"]

[tool.pytest.ini_options]
# The MCP layer keeps its own tests inside its folder (contract tests live with the layer),
# so `make test` picks them up alongside the repo suite.
testpaths = ["tests", "mcp/tests", "automation/pipeline/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# cli/censurado.py is a deliberately compact, stdlib-only operator CLI: it uses one-line
# `if x: y` payload builders (E701) and a single grouped stdlib import (E401). Real defects
# (e.g. f-string syntax that is invalid on the declared 3.11 floor) are still caught.
"cli/censurado.py" = ["E701", "E401"]
