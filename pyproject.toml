[project]
name = "censurado-web-brain"
version = "0.0.0"
description = "Newsroom config plane for the censurado-web platform: stores the authors, sources, prompts, and editorial style and serves them to a CLI agent and the harness operator panel. Runs no model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hector Oviedo" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    # The schema-drift guard validates the vendored article.schema.json (test-only;
    # previously pulled in transitively, now declared explicitly).
    "jsonschema>=4.0",
]

[project.scripts]
# The brain's management CLI: command-line parity of the config-plane HTTP API
# (authors, sources, prompts, editorial style). See newsroom.cli.
censurado-brain = "newsroom.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "newsroom",
    "newsroom.contracts",
    "newsroom.brain",
    "newsroom.personas",
    "newsroom.editorial",
    "newsroom.mirror",
    "newsroom.cleanse",
    "testkit",
]

[tool.setuptools.package-data]
"newsroom.contracts" = ["vendored/v1/*.json", "vendored/v1/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
