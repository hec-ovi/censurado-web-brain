[project]
name = "censurado-web-brain"
version = "0.0.0"
description = "Agentic newsroom harness that researches, drafts, reviews, and publishes articles to the censurado-web platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hector Oviedo" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # The journalists' research tool, reused whole (Step 4). Pinned to the public
    # release tag; keyless multi-engine search + URL fetch with an SSRF guard.
    "websearch-skill @ git+https://github.com/hec-ovi/websearch-skill@v0.1.0",
    # Typed structured output at the FINALIZE seam ONLY (Step 5): prompted-JSON
    # output validated into the publish payload with one re-prompt on failure. No
    # output-length cap is ever set on the model (the body is never truncated).
    "pydantic-ai>=1.107,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
# The automation entry point: run the newsroom once and exit. An external periodic
# trigger invokes this with a --mode (the entire trigger surface). See newsroom.cli.
censurado-brain = "newsroom.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "newsroom",
    "newsroom.contracts",
    "newsroom.brain",
    "newsroom.personas",
    "newsroom.editorial",
    "newsroom.inference",
    "newsroom.research",
    "newsroom.pipeline",
    "newsroom.runs",
    "newsroom.manager",
    "newsroom.publish",
    "newsroom.imagery",
    "newsroom.runner",
    "newsroom.mirror",
    "newsroom.cleanse",
    "testkit",
]

[tool.setuptools.package-data]
"newsroom.contracts" = ["vendored/v1/*.json", "vendored/v1/*.md"]
"newsroom.imagery" = ["templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Silence a transitive websockets deprecation pulled in via fastmcp (a
# websearch-skill dependency); it is third-party noise, scoped narrowly here.
filterwarnings = [
    "ignore:websockets.legacy is deprecated.*:DeprecationWarning",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated.*:DeprecationWarning",
    # pydantic-ai's run_sync uses the deprecated get_event_loop() internally when
    # called off the event loop (the finalize seam runs in a worker thread); their
    # code, scoped narrowly here.
    "ignore:There is no current event loop:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
