[project]
name = "censurado-web-brain"
version = "0.0.0"
description = "Agentic newsroom harness that researches, drafts, reviews, and publishes articles to the censurado-web platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hector Oviedo" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

# pydantic-ai is added at Step 5 (typed structured output at the finalize seam),
# so Step 0's install stays minimal and robust.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "newsroom",
    "newsroom.contracts",
    "newsroom.brain",
    "newsroom.personas",
    "newsroom.inference",
    "newsroom.research",
    "newsroom.publish",
    "testkit",
]

[tool.setuptools.package-data]
"newsroom.contracts" = ["vendored/v1/*.json", "vendored/v1/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
