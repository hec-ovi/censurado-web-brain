<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Censurado · Newsroom Docs</title>
<meta name="description" content="Documentacion interactiva de la redaccion agentica Censurado: el workflow con compuertas, los modos, la arquitectura, los contratos y los verbos de la CLI.">
<style>
:root{
  --bg:#0d0a0b; --surface:#161213; --surface-2:#1e1819; --surface-3:#251d1f;
  --line:#3a2f32; --line-soft:#2a2224; --text:#f5eff1; --muted:#b6a8ac; --faint:#7e7074;
  --red:#ff3b5f; --red-deep:#e01842; --steel:#3ba9c9; --gold:#e0a84a; --green:#3fb98a; --violet:#b39cf0;
  --shadow:rgba(0,0,0,.55);
  --sans:ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --nav-w:262px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:13px; line-height:1.55;
  overflow:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
::selection{background:rgba(255,59,95,.28)}
a{color:var(--red); text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--red); outline-offset:2px; border-radius:4px}
button{font-family:inherit}
h1,h2,h3,h4{margin:0; font-weight:650; letter-spacing:-.01em}

/* ---------- app shell ---------- */
#app{
  position:fixed; inset:0;
  display:grid; grid-template-columns:var(--nav-w) 1fr;
  background:var(--bg);
}

/* ---------- left nav ---------- */
#nav{
  display:flex; flex-direction:column; min-height:0;
  background:linear-gradient(180deg,#171213,#120e0f);
  border-right:1px solid var(--line);
}
.brand{padding:20px 18px 14px; border-bottom:1px solid var(--line-soft)}
.eyebrow{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.34em; font-weight:700;
  color:var(--red); text-transform:uppercase;
}
.brand h1{font-size:18px; margin-top:6px; line-height:1.15}
.brand .subtitle{color:var(--muted); font-size:11.5px; margin-top:6px; max-width:210px}

.navlist{flex:1 1 auto; min-height:0; overflow-y:auto; padding:10px 10px 14px}
.navlist::-webkit-scrollbar{width:9px}
.navlist::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:9px}

.navsec{margin-bottom:2px}
.navsec>button{
  width:100%; display:flex; align-items:center; gap:9px;
  background:transparent; border:1px solid transparent; border-radius:9px;
  color:var(--text); padding:8px 9px; cursor:pointer; text-align:left; font-size:12.5px;
}
.navsec>button:hover{background:var(--surface-2)}
.navsec.active>button{background:var(--surface-3); border-color:var(--line)}
.navsec.active>button .nsecLabel{color:var(--text)}
.nsecLabel{flex:1 1 auto; font-weight:550}
.dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 0 3px rgba(255,255,255,.03)}
.star{font-size:10px; color:var(--gold)}
.caret{color:var(--faint); font-size:10px; transition:transform .18s ease}
.navsec.open .caret{transform:rotate(90deg)}

.subitems{list-style:none; margin:2px 0 6px; padding:0 0 0 24px; display:none}
.navsec.open .subitems{display:block}
.subitems li{margin:0}
.subitems button{
  width:100%; text-align:left; background:transparent; border:0; cursor:pointer;
  color:var(--muted); font-family:var(--mono); font-size:11px; padding:4px 8px; border-radius:6px;
  border-left:1px solid var(--line-soft); margin-left:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.subitems button:hover{color:var(--text); background:var(--surface-2)}

.navfoot{
  padding:11px 18px; border-top:1px solid var(--line-soft);
  color:var(--faint); font-size:11px; font-family:var(--mono);
}

/* ---------- main ---------- */
#main{display:grid; grid-template-rows:auto 1fr; min-width:0; min-height:0}
.topbar{
  display:flex; align-items:center; gap:16px; justify-content:space-between;
  padding:14px 20px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#151011,#120e0f);
}
.crumb{min-width:0}
.crumb h2{font-size:16px; display:flex; align-items:center; gap:8px}
.crumb .crumbSub{color:var(--muted); font-size:11.5px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.modeToggle{
  display:inline-flex; background:var(--surface); border:1px solid var(--line);
  border-radius:10px; padding:3px; flex:0 0 auto;
}
.segbtn{
  background:transparent; border:0; color:var(--muted); cursor:pointer;
  padding:6px 15px; border-radius:8px; font-size:12px; font-weight:600; letter-spacing:.01em;
}
.segbtn:hover{color:var(--text)}
.segbtn.active{background:var(--red); color:#1a0308; box-shadow:0 3px 10px rgba(255,59,95,.28)}

/* ---------- stage ---------- */
#stage{
  position:relative; min-width:0; min-height:0; overflow:hidden;
  background:
    linear-gradient(var(--line-soft) 1px, transparent 1px) 0 0/36px 36px,
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px) 0 0/36px 36px,
    radial-gradient(1200px 620px at 78% -12%, rgba(255,59,95,.06), transparent 60%),
    var(--bg);
}

/* ---------- map ---------- */
.mapWrap{position:absolute; inset:0}
#atlas{width:100%; height:100%; display:block; touch-action:none; cursor:grab}
#atlas.grabbing{cursor:grabbing}
.node{cursor:pointer}
.nbox{fill:var(--surface-2); stroke:var(--line); stroke-width:1.4; filter:drop-shadow(0 5px 12px var(--shadow))}
.node:hover .nbox,.node:focus-visible .nbox{stroke:var(--red)}
.node:focus-visible{outline:none}
.node:focus-visible .nbox{stroke-width:2}
.nlabel{fill:var(--text); font-weight:650; font-size:13px; font-family:var(--mono)}
.nkind{font-size:10px; font-family:var(--mono); letter-spacing:.06em; text-transform:uppercase; opacity:.92}
.nnote{fill:var(--faint); font-size:10px; font-family:var(--sans)}
.edge{fill:none; stroke-width:1.7}
.elabel{fill:var(--muted); font-size:10px; font-family:var(--mono)}
.elabel-bg{fill:var(--bg); opacity:.9; stroke:var(--line-soft); stroke-width:.75; rx:4}
.grp{fill:rgba(59,169,201,.05); stroke:var(--steel); stroke-width:1.2; stroke-dasharray:5 5; rx:16}
.grpLabel{fill:var(--steel); font-size:11px; font-family:var(--mono); letter-spacing:.05em; text-transform:uppercase}

.mapctl{position:absolute; left:14px; bottom:14px; display:flex; gap:7px; z-index:4}
.mapctl button{
  background:var(--surface); border:1px solid var(--line); color:var(--text);
  padding:6px 12px; border-radius:8px; cursor:pointer; font-size:11.5px; font-weight:600;
  box-shadow:0 4px 12px var(--shadow);
}
.mapctl button:hover{border-color:var(--red); color:var(--red)}
.legend{
  position:absolute; left:14px; top:14px; z-index:4;
  background:rgba(20,15,16,.82); backdrop-filter:blur(3px);
  border:1px solid var(--line); border-radius:11px; padding:9px 11px;
  display:flex; flex-direction:column; gap:5px; max-width:230px;
}
.legend .lgttl{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:2px}
.pill{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted)}
.hint{
  position:absolute; right:14px; bottom:14px; z-index:4;
  font-family:var(--mono); font-size:10.5px; color:var(--faint);
  background:rgba(20,15,16,.7); border:1px solid var(--line-soft); border-radius:8px; padding:5px 9px;
}

/* ---------- text view ---------- */
.textWrap{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; padding:26px 24px 90px}
.textWrap::-webkit-scrollbar{width:11px}
.textWrap::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:11px}
.doc{max-width:1080px; margin:0 auto}
.lede{color:var(--muted); font-size:14px; line-height:1.62; max-width:70ch; margin:0 0 22px}
.lede strong{color:var(--text); font-weight:650}

.doc-section{
  border:1px solid var(--line); border-radius:16px;
  background:linear-gradient(180deg,var(--surface),#141011);
  padding:18px 18px 20px; margin-bottom:18px;
}
.ds-head{margin-bottom:14px}
.ds-head h3{font-size:15px}
.ds-head .ds-sub{color:var(--muted); font-size:12px; margin-top:4px; max-width:74ch}
.eyebrow-s{font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--red); display:block; margin-bottom:5px}

.cardgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:12px}
.card{
  border:1px solid var(--line); border-radius:13px; background:var(--surface-2);
  padding:12px 13px; min-width:0;
}
.card.wide{grid-column:1/-1}
.ct{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.clabel{font-family:var(--mono); font-size:12.5px; font-weight:650; color:var(--text)}
.kindtag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); border:1px solid var(--line); border-radius:20px; padding:1px 8px; margin-left:auto;
}
.sum{color:var(--muted); font-size:12px; margin-top:7px; line-height:1.55}
.sum b{color:var(--text); font-weight:600}
.row{margin-top:9px; display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.row .lbl{font-family:var(--mono); font-size:10px; color:var(--faint); text-transform:uppercase; letter-spacing:.06em}
.flag{
  font-family:var(--mono); font-size:10px; padding:2px 8px; border-radius:20px; border:1px solid;
}
.flag.gate{color:var(--gold); border-color:rgba(224,168,74,.5); background:rgba(224,168,74,.08)}
.flag.loop{color:var(--violet); border-color:rgba(179,156,240,.5); background:rgba(179,156,240,.08)}
.flag.gated{color:var(--faint); border-color:var(--line); background:rgba(126,112,116,.08)}
.flag.emit{color:var(--green); border-color:rgba(63,185,138,.5); background:rgba(63,185,138,.08)}

.chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.chip{
  font-family:var(--mono); font-size:11px; color:var(--text);
  background:var(--surface-3); border:1px solid var(--line); border-radius:7px; padding:3px 9px;
}
.chip.mut{color:var(--muted)}
.grouplbl{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); margin:12px 0 2px; display:block}
.grouplbl.write{color:var(--red)} .grouplbl.curate{color:var(--steel)} .grouplbl.operate{color:var(--green)} .grouplbl.brain{color:var(--violet)}

.jsonbox{
  background:#0b0809; border:1px solid var(--line); border-radius:11px;
  padding:13px 14px; overflow-x:auto; margin:12px 0 2px;
  font-family:var(--mono); font-size:12px; line-height:1.6; color:var(--text);
}
.jsonbox code{font-family:inherit}
.jsonbox .k{color:var(--steel)}
.jsonbox .s{color:var(--gold)}
.jsonbox .n{color:var(--violet)}
.jsonbox .b{color:var(--red)}

.tree{
  font-family:var(--mono); font-size:12px; line-height:1.7;
  background:#0b0809; border:1px solid var(--line); border-radius:11px;
  padding:14px 15px; overflow-x:auto;
}
.trow{white-space:pre}
.trow .tname{color:var(--text)}
.trow .tdir{color:var(--steel); font-weight:600}
.trow .tfile{color:var(--gold)}
.trow .tguide{color:var(--faint)}
.trow .tcom{color:var(--faint)}

.overviewGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:13px}
a.ocard{
  display:flex; flex-direction:column; gap:6px; text-decoration:none;
  border:1px solid var(--line); border-radius:14px; background:var(--surface-2);
  padding:14px 15px; color:var(--text);
}
a.ocard:hover{border-color:var(--red); text-decoration:none; transform:translateY(-1px); background:var(--surface-3)}
a.ocard{transition:transform .15s ease, border-color .15s ease, background .15s ease}
.ocard .otop{display:flex; align-items:center; gap:9px}
.ocard .otitle{font-size:13.5px; font-weight:650}
.ocard .odesc{color:var(--muted); font-size:11.5px; line-height:1.5}
.ocard .ogo{font-family:var(--mono); font-size:10px; color:var(--red); letter-spacing:.08em; text-transform:uppercase; margin-top:2px}

.callout{
  border:1px solid var(--line); border-left:3px solid var(--red); border-radius:10px;
  background:rgba(255,59,95,.05); padding:11px 13px; color:var(--muted); font-size:12px; margin-top:12px;
}
.callout b{color:var(--text)}

/* ---------- slide panel ---------- */
#panel{
  position:fixed; top:0; right:0; height:100%; width:48%; max-width:640px; min-width:340px; z-index:40;
  background:linear-gradient(180deg,var(--surface),#120e0f);
  border-left:1px solid var(--line); box-shadow:-24px 0 60px var(--shadow);
  transform:translateX(101%); transition:transform .28s cubic-bezier(.22,.61,.36,1);
  display:flex; flex-direction:column;
}
#panel.open{transform:translateX(0)}
.pclose{
  align-self:flex-end; margin:12px 14px 0; background:var(--surface-3); border:1px solid var(--line);
  color:var(--muted); cursor:pointer; padding:5px 11px; border-radius:8px; font-size:11.5px; font-family:var(--mono);
}
.pclose:hover{color:var(--red); border-color:var(--red)}
.pbody{padding:8px 22px 30px; overflow-y:auto}
.pbody .pkind{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:700}
.pbody .ptitle{font-size:19px; font-family:var(--mono); margin:6px 0 10px}
.pbody .psum{color:var(--text); font-size:13.5px; line-height:1.6}
.pbody .pdetails{margin:14px 0 0; padding-left:18px; color:var(--muted); font-size:12.5px; line-height:1.62}
.pbody .pdetails li{margin-bottom:8px}
.pbody .pdetails code, .pbody .psum code{font-family:var(--mono); font-size:11.5px; background:var(--surface-3); border:1px solid var(--line); border-radius:5px; padding:1px 5px; color:var(--text)}
.pbody .chips{margin-top:12px}

/* ---------- responsive ---------- */
@media (max-width:820px){
  body{overflow:auto}
  #app{grid-template-columns:1fr; grid-template-rows:auto 1fr; position:fixed; inset:0}
  #nav{border-right:0; border-bottom:1px solid var(--line); max-height:44vh}
  .brand{padding:14px 16px 10px}
  .navlist{max-height:none}
  #panel{width:100%; max-width:none; min-width:0}
  .topbar{padding:11px 14px}
  .textWrap{padding:18px 14px 80px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important; animation:none!important; scroll-behavior:auto!important}
  a.ocard:hover{transform:none}
}
</style>
</head>
<body>
<div id="app">
  <aside id="nav" aria-label="Secciones">
    <div class="brand">
      <div class="eyebrow">CENSURADO</div>
      <h1>Newsroom Docs</h1>
      <div class="subtitle">La receta agentica de una redaccion de IA autohospedada.</div>
    </div>
    <nav class="navlist" id="navlist" aria-label="Navegacion de secciones"></nav>
    <div class="navfoot">Built from the live recipe.</div>
  </aside>

  <main id="main">
    <header class="topbar">
      <div class="crumb">
        <h2 id="crumbTitle">Overview</h2>
        <div class="crumbSub" id="crumbSub"></div>
      </div>
      <div class="modeToggle" role="tablist" aria-label="Modo de vista">
        <button class="segbtn" id="mMap" role="tab" aria-selected="false">Mapa</button>
        <button class="segbtn active" id="mText" role="tab" aria-selected="true">Texto</button>
      </div>
    </header>
    <section id="stage" aria-live="polite"></section>
  </main>

  <aside id="panel" aria-hidden="true" aria-label="Detalle del nodo">
    <button class="pclose" id="pclose" aria-label="Cerrar panel">Cerrar &#10005;</button>
    <div class="pbody" id="pbody"></div>
  </aside>
</div>

<script>
"use strict";
(function(){
  var NODE_W=200, NODE_H=64;
  var LANE={red:'var(--red)',steel:'var(--steel)',gold:'var(--gold)',green:'var(--green)',violet:'var(--violet)',faint:'var(--faint)'};
  var EDGE={
    flow:{stroke:'var(--muted)',dash:'',m:'m-muted'},
    pass:{stroke:'var(--green)',dash:'',m:'m-green'},
    loop:{stroke:'var(--violet)',dash:'',m:'m-violet'},
    gated:{stroke:'var(--faint)',dash:'6 5',m:'m-faint'},
    seam:{stroke:'var(--steel)',dash:'6 5',m:'m-steel'},
    media:{stroke:'var(--gold)',dash:'4 4',m:'m-gold'}
  };

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function hl(str){
    return esc(str).replace(/("(?:\\.|[^"\\])*"(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?)/g, function(m){
      var cls='n';
      if(m.charAt(0)==='"'){ cls = /:\s*$/.test(m)?'k':'s'; }
      else if(/^(true|false|null)$/.test(m)) cls='b';
      return '<span class="'+cls+'">'+m+'</span>';
    });
  }

  /* ---------- text builders ---------- */
  var el={
    card:function(o){
      return '<div class="card'+(o.wide?' wide':'')+'"'+(o.id?(' id="'+o.id+'"'):'')+'>'
        +'<div class="ct"><span class="dot" style="background:'+(o.color||'var(--red)')+'"></span>'
        +'<span class="clabel">'+o.label+'</span>'+(o.tag?('<span class="kindtag">'+o.tag+'</span>'):'')+'</div>'
        +(o.sum?('<div class="sum">'+o.sum+'</div>'):'')
        +(o.extra||'')+'</div>';
    },
    chips:function(arr,mut){return '<div class="chips">'+arr.map(function(c){return '<span class="chip'+(mut?' mut':'')+'">'+esc(c)+'</span>';}).join('')+'</div>';},
    json:function(s){return '<pre class="jsonbox"><code>'+hl(s)+'</code></pre>';}
  };

  /* =====================================================================
     CONTENT MODEL
     ===================================================================== */

  // Workflow pipeline nodes ------------------------------------------------
  var COL=function(c){return 48+c*236;};
  var WF=[
    {id:'15-pick-author',c:0,y:220,kind:'setup',lane:'steel',
      summary:'Carga el autor (voz, sesgo, fuentes asignadas) desde el backend.',
      details:['El nodo pide la persona al store: su registro de voz, su sesgo declarado y la lista de medios que tiene permiso de nombrar.','Todo lo que sigue queda anclado a ese autor: el tema, las fuentes legibles y los medios citables.']},
    {id:'20-fresh-titulars',c:1,y:220,kind:'setup',lane:'steel',
      summary:'Solo modos single-author / authors: elige un tema fresco y no cubierto para ese autor.',
      details:['Presente unicamente cuando el autor elige su propio tema (single-article recibe el tema desde afuera).','Descarta lo ya publicado para no repetir historias.']},
    {id:'30-research',c:2,y:220,kind:'research',lane:'steel',emits:'ledger.md',
      summary:'Lee las fuentes <b>asignadas</b> del autor (feeds + sitemaps frescos) y usa busqueda web para INFORMAR hechos.',
      details:['Cada hecho central se valida en al menos <code>MIN_SOURCES</code> fuentes independientes de cada tendencia politica: derecha, neutral e izquierda.','Los medios hallados por busqueda web son contexto y <b>nunca se nombran</b>: solo los medios asignados del autor y los actores primarios son nombrables.','Emite <code>ledger.md</code>, el registro de hechos que la compuerta comprueba.']},
    {id:'40-outline',c:3,y:220,kind:'structure',lane:'steel',
      summary:'Fija el angulo y la estructura antes de escribir.',
      details:['Decide que lidera, que sostiene la nota y en que orden, para que el borrador no divague.']},
    {id:'50-draft',c:4,y:220,kind:'write',lane:'red',emits:'draft.md',
      summary:'Escribe la pieza en la voz del autor, anclada en el ledger.',
      details:['Fuentes nombradas como texto plano ("segun X"), <b>sin enlaces</b> en el cuerpo.','Solo los medios <b>asignados</b> del autor pueden nombrarse.','Emite <code>draft.md</code>.']},
    {id:'60-evaluate',c:5,y:220,kind:'gate',lane:'gold',flag:'compuerta',
      summary:'Juzga 6 dimensiones, cada una PASS / REVISE.',
      details:['1. Cross-sourcing entre tendencias (y todo medio nombrado esta asignado).','2. Acentos, n con virgulilla y signos de apertura (&iquest; &iexcl;).','3. Entidades correctas.','4. Titulo honesto (max 5 palabras).','5. Densidad informativa.','6. Cero relleno / clichés de IA.','Si algo falla, la pieza baja al respin; solo con las seis en PASS sigue el flujo.']},
    {id:'70-respin',c:6,y:70,kind:'loop',lane:'violet',flag:'bucle',
      summary:'Reescribe lo que fallo y re-evalua.',
      details:['Repite hasta que las seis dimensiones pasen o se agoten los intentos de respin.','Junto con 60-evaluate forma el bucle de calidad de la caminata.']},
    {id:'75-factcheck',c:7,y:220,kind:'verify',lane:'steel',
      summary:'Verifica los hechos centrales contra el ledger.',
      details:['Elimina toda cita que no este en el ledger o fuera de la lista asignada del autor, conservando el hecho.']},

  /* ---------- map ---------- */
  function markerDefs(){
    var colors={'m-muted':'var(--muted)','m-green':'var(--green)','m-violet':'var(--violet)','m-faint':'var(--faint)','m-steel':'var(--steel)','m-gold':'var(--gold)'};

      out+='<marker id="'+id+'" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" style="fill:'+colors[id]+'"></path></marker>';
    }
    out+='</defs>';
    return out;
  }

  function ports(n){
    var w=n.w||NODE_W, h=n.h||NODE_H;
    return {
      r:{x:n.x+w,y:n.y+h/2}, l:{x:n.x,y:n.y+h/2},
      t:{x:n.x+w/2,y:n.y}, b:{x:n.x+w/2,y:n.y+h},
      cx:n.x+w/2, cy:n.y+h/2, w:w, h:h
    };
  }
  function edgePath(a,b,type){
    var pa=ports(a), pb=ports(b);
    if(type==='loop'){
      var s=pa.l, t=pb.t;
      if(pb.cx>pa.cx){ s=pa.t; t=pb.l; var dx=Math.max(40,(t.x-s.x)/2); return 'M'+s.x+','+s.y+' C'+(s.x)+','+(s.y-40)+' '+(t.x-dx)+','+t.y+' '+t.x+','+t.y; }
      return 'M'+s.x+','+s.y+' C'+(s.x-70)+','+s.y+' '+t.x+','+(t.y-70)+' '+t.x+','+t.y;
    }
    if(pb.cx>=pa.cx){
      var s2=pa.r, t2=pb.l, d2=Math.max(42,(t2.x-s2.x)/2);
      return 'M'+s2.x+','+s2.y+' C'+(s2.x+d2)+','+s2.y+' '+(t2.x-d2)+','+t2.y+' '+t2.x+','+t2.y;
    }
    var s3=pa.b, t3=pb.b, dy=70;
    return 'M'+s3.x+','+s3.y+' C'+s3.x+','+(s3.y+dy)+' '+t3.x+','+(t3.y+dy)+' '+t3.x+','+t3.y;
  }
  function midPoint(a,b){ var pa=ports(a),pb=ports(b); return {x:(pa.cx+pb.cx)/2,y:(pa.cy+pb.cy)/2}; }

  function renderMap(sec){
    var data=sec.map;
    var legend=(data.legend||[]).map(function(l){
      return '<div class="pill"><span class="dot" style="background:'+LANE[l.c]+'"></span>'+esc(l.t)+'</div>';
    }).join('');

    var groupsSvg=(data.groups||[]).map(function(g){
      return '<rect class="grp" x="'+g.x+'" y="'+g.y+'" width="'+g.w+'" height="'+g.h+'" rx="16"></rect>'
        +'<text class="grpLabel" x="'+(g.x+14)+'" y="'+(g.y+22)+'">'+esc(g.label)+'</text>';
    }).join('');

    var edgesSvg=data.edges.map(function(e){
      var a=nodeById(sec,e.from), b=nodeById(sec,e.to);
      if(!a||!b) return '';
      var cfg=EDGE[e.type||'flow']||EDGE.flow;
      var d=edgePath(a,b,e.type||'flow');
      var path='<path class="edge" d="'+d+'" style="stroke:'+cfg.stroke+(cfg.dash?';stroke-dasharray:'+cfg.dash:'')+'" marker-end="url(#'+cfg.m+')"></path>';
      var lbl='';
      if(e.label){

      }
      return path+lbl;
    }).join('');

    var nodesSvg=data.nodes.map(function(n){
      var w=n.w||NODE_W, h=n.h||NODE_H;

      return '<g class="node lane-'+n.lane+'" data-id="'+esc(n.id)+'" tabindex="0" role="button" aria-label="'+esc(label)+'" transform="translate('+n.x+','+n.y+')">'
        +'<rect class="nbox" width="'+w+'" height="'+h+'" rx="12"></rect>'
        +'<rect x="0" y="0" width="6" height="'+h+'" rx="3" style="fill:'+LANE[n.lane]+'"></rect>'
        +'<text class="nlabel" x="18" y="27">'+esc(label)+'</text>'
        +'<text class="nkind" x="18" y="46" style="fill:'+LANE[n.lane]+'">'+esc(n.kind||'')+'</text>'
        +'</g>';
    }).join('');

    stage.innerHTML=
      '<div class="mapWrap">'
      +'<svg id="atlas" role="img" aria-label="Mapa de '+esc(sec.label)+'">'
      +markerDefs()
      +'<g id="viewport">'+groupsSvg+edgesSvg+nodesSvg+'</g>'
      +'</svg></div>'
      +'<div class="legend"><div class="lgttl">Leyenda</div>'+legend+'</div>'
      +'<div class="mapctl"><button type="button" id="btnFit">Fit</button><button type="button" id="btnReset">Reset</button></div>'
      +'<div class="hint">arrastra para moverte &middot; rueda para zoom</div>';

    wireMap(sec);
  }

  var view={tx:40,ty:40,k:1};
  function wireMap(sec){
    var svg=document.getElementById('atlas');
    var vp=document.getElementById('viewport');
    if(!svg||!vp) return;

    function apply(){ vp.setAttribute('transform','translate('+view.tx+','+view.ty+') scale('+view.k+')'); }
    function bbox(){
      var ns=sec.map.nodes, gs=sec.map.groups||[];
      var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
      ns.forEach(function(n){ var w=n.w||NODE_W,h=n.h||NODE_H; minx=Math.min(minx,n.x); miny=Math.min(miny,n.y); maxx=Math.max(maxx,n.x+w); maxy=Math.max(maxy,n.y+h); });
      gs.forEach(function(g){ minx=Math.min(minx,g.x); miny=Math.min(miny,g.y); maxx=Math.max(maxx,g.x+g.w); maxy=Math.max(maxy,g.y+g.h); });
      return {minx:minx,miny:miny,maxx:maxx,maxy:maxy};
    }
    function fit(){
      var bb=bbox(); var pad=54;
      var bw=(bb.maxx-bb.minx)+pad*2, bh=(bb.maxy-bb.miny)+pad*2;
      var sw=stage.clientWidth||900, sh=stage.clientHeight||600;
      var k=Math.min(sw/bw, sh/bh, 1.15); if(!isFinite(k)||k<=0) k=1;
      view.k=k;
      view.tx=(sw-bw*k)/2 - (bb.minx-pad)*k;
      view.ty=(sh-bh*k)/2 - (bb.miny-pad)*k;
      apply();
    }
    function reset(){ view.k=1; view.tx=40; view.ty=36; apply(); }

    var fitBtn=document.getElementById('btnFit'), resetBtn=document.getElementById('btnReset');
    if(fitBtn) fitBtn.addEventListener('click',fit);
    if(resetBtn) resetBtn.addEventListener('click',reset);

    // pan
    var dragging=false, moved=false, sx=0, sy=0, otx=0, oty=0;
    svg.addEventListener('pointerdown',function(e){
      if(e.target.closest('.node')) return;
      dragging=true; moved=false; sx=e.clientX; sy=e.clientY; otx=view.tx; oty=view.ty;
      svg.classList.add('grabbing');
      try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    });
    svg.addEventListener('pointermove',function(e){
      if(!dragging) return;
      var dx=e.clientX-sx, dy=e.clientY-sy;
      if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
      view.tx=otx+dx; view.ty=oty+dy; apply();
    });
    function endDrag(e){ dragging=false; svg.classList.remove('grabbing'); if(e){ try{ svg.releasePointerCapture(e.pointerId); }catch(_){} } }
    svg.addEventListener('pointerup',endDrag);
    svg.addEventListener('pointercancel',endDrag);
    svg.addEventListener('pointerleave',function(e){ if(dragging) endDrag(e); });

    // zoom
    svg.addEventListener('wheel',function(e){
      e.preventDefault();
      var rect=svg.getBoundingClientRect();
      var mx=e.clientX-rect.left, my=e.clientY-rect.top;
      var factor=e.deltaY<0?1.12:1/1.12;
      var nk=Math.max(0.28,Math.min(2.6,view.k*factor));
      view.tx=mx-(mx-view.tx)*(nk/view.k);
      view.ty=my-(my-view.ty)*(nk/view.k);
      view.k=nk; apply();
    },{passive:false});

    // node interactions
    var nodeEls=svg.querySelectorAll('.node');
    for(var i=0;i<nodeEls.length;i++){
      (function(g){
        var id=g.getAttribute('data-id');
        g.addEventListener('click',function(){ if(moved) return; var n=nodeById(sec,id); if(n) openPanel(n); });
        g.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); var n=nodeById(sec,id); if(n) openPanel(n); } });
      })(nodeEls[i]);
    }

    requestAnimationFrame(fit);
  }

  /* ---------- panel ---------- */
  function openPanel(node){
    pbody.innerHTML=
      '<div class="pkind" style="color:'+LANE[node.lane]+'">'+esc(node.kind||'')+'</div>'
      +'<h3 class="ptitle">'+esc(node.label||node.id)+'</h3>'
      +'<p class="psum">'+(node.summary||'')+'</p>'
      +(node.details&&node.details.length?('<ul class="pdetails">'+node.details.map(function(d){return '<li>'+d+'</li>';}).join('')+'</ul>'):'');
    panel.classList.add('open');
    panel.setAttribute('aria-hidden','false');
  }
  function closePanel(){ panel.classList.remove('open'); panel.setAttribute('aria-hidden','true'); }
  pclose.addEventListener('click',closePanel);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closePanel(); });

  /* ---------- resize: refit map ---------- */
  var rt=null;
  window.addEventListener('resize',function(){
    if(state.mode!=='map') return;
    if(rt) clearTimeout(rt);
    rt=setTimeout(function(){ var b=document.getElementById('btnFit'); if(b) b.click(); },160);
  });

  /* ---------- init ---------- */
  buildNav();
  selectSection('overview');
})();
</script>
</body>
</html>
