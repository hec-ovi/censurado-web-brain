<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Censurado · Newsroom Docs</title>
<meta name="description" content="Interactive documentation for the Censurado agentic newsroom: the gated workflow, the modes, the architecture, the contracts and the CLI verbs.">
<style>
:root{
  --bg:#0d0a0b; --surface:#161213; --surface-2:#1e1819; --surface-3:#251d1f;
  --line:#3a2f32; --line-soft:#2a2224; --text:#f5eff1; --muted:#b6a8ac; --faint:#7e7074;
  --red:#ff3b5f; --red-deep:#e01842; --steel:#3ba9c9; --gold:#e0a84a; --green:#3fb98a; --violet:#b39cf0;
  --shadow:rgba(0,0,0,.55);
  --sans:ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --nav-w:262px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:13px; line-height:1.55;
  overflow:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
::selection{background:rgba(255,59,95,.28)}
a{color:var(--red); text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--red); outline-offset:2px; border-radius:4px}
button{font-family:inherit}
h1,h2,h3,h4{margin:0; font-weight:650; letter-spacing:-.01em}

/* ---------- app shell ---------- */
#app{
  position:fixed; inset:0;
  display:grid; grid-template-columns:var(--nav-w) 1fr;
  background:var(--bg);
}

/* ---------- left nav ---------- */
#nav{
  display:flex; flex-direction:column; min-height:0;
  background:linear-gradient(180deg,#171213,#120e0f);
  border-right:1px solid var(--line);
}
.brand{padding:20px 18px 14px; border-bottom:1px solid var(--line-soft)}
.eyebrow{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.34em; font-weight:700;
  color:var(--red); text-transform:uppercase;
}
.brand h1{font-size:18px; margin-top:6px; line-height:1.15}
.brand .subtitle{color:var(--muted); font-size:11.5px; margin-top:6px; max-width:210px}

.navlist{flex:1 1 auto; min-height:0; overflow-y:auto; padding:10px 10px 14px}
.navlist::-webkit-scrollbar{width:9px}
.navlist::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:9px}

.navsec{margin-bottom:2px}
.navsec>button{
  width:100%; display:flex; align-items:center; gap:9px;
  background:transparent; border:1px solid transparent; border-radius:9px;
  color:var(--text); padding:8px 9px; cursor:pointer; text-align:left; font-size:12.5px;
}
.navsec>button:hover{background:var(--surface-2)}
.navsec.active>button{background:var(--surface-3); border-color:var(--line)}
.navsec.active>button .nsecLabel{color:var(--text)}
.nsecLabel{flex:1 1 auto; font-weight:550}
.dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 0 3px rgba(255,255,255,.03)}
.star{font-size:10px; color:var(--gold)}
.caret{color:var(--faint); font-size:10px; transition:transform .18s ease}
.navsec.open .caret{transform:rotate(90deg)}

.subitems{list-style:none; margin:2px 0 6px; padding:0 0 0 24px; display:none}
.navsec.open .subitems{display:block}
.subitems li{margin:0}
.subitems button{
  width:100%; text-align:left; background:transparent; border:0; cursor:pointer;
  color:var(--muted); font-family:var(--mono); font-size:11px; padding:4px 8px; border-radius:6px;
  border-left:1px solid var(--line-soft); margin-left:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.subitems button:hover{color:var(--text); background:var(--surface-2)}

.navfoot{
  padding:11px 18px; border-top:1px solid var(--line-soft);
  color:var(--faint); font-size:11px; font-family:var(--mono);
}

/* ---------- main ---------- */
#main{display:grid; grid-template-rows:auto 1fr; min-width:0; min-height:0}
.topbar{
  display:flex; align-items:center; gap:16px; justify-content:space-between;
  padding:14px 20px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#151011,#120e0f);
}
.crumb{min-width:0}
.crumb h2{font-size:16px; display:flex; align-items:center; gap:8px}
.crumb .crumbSub{color:var(--muted); font-size:11.5px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.modeToggle{
  display:inline-flex; background:var(--surface); border:1px solid var(--line);
  border-radius:10px; padding:3px; flex:0 0 auto;
}
.segbtn{
  background:transparent; border:0; color:var(--muted); cursor:pointer;
  padding:6px 15px; border-radius:8px; font-size:12px; font-weight:600; letter-spacing:.01em;
}
.segbtn:hover{color:var(--text)}
.segbtn.active{background:var(--red); color:#1a0308; box-shadow:0 3px 10px rgba(255,59,95,.28)}

/* ---------- stage ---------- */
#stage{
  position:relative; min-width:0; min-height:0; overflow:hidden;
  background:
    linear-gradient(var(--line-soft) 1px, transparent 1px) 0 0/36px 36px,
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px) 0 0/36px 36px,
    radial-gradient(1200px 620px at 78% -12%, rgba(255,59,95,.06), transparent 60%),
    var(--bg);
}

/* ---------- map ---------- */
.mapWrap{position:absolute; inset:0}
#atlas{width:100%; height:100%; display:block; touch-action:none; cursor:grab}
#atlas.grabbing{cursor:grabbing}
.node{cursor:pointer}
.nbox{fill:var(--surface-2); stroke:var(--line); stroke-width:1.4; filter:drop-shadow(0 5px 12px var(--shadow))}
.node:hover .nbox,.node:focus-visible .nbox{stroke:var(--red)}
.node:focus-visible{outline:none}
.node:focus-visible .nbox{stroke-width:2}
.nlabel{fill:var(--text); font-weight:650; font-size:13px; font-family:var(--mono)}
.nkind{font-size:10px; font-family:var(--mono); letter-spacing:.06em; text-transform:uppercase; opacity:.92}
.nnote{fill:var(--faint); font-size:10px; font-family:var(--sans)}
.edge{fill:none; stroke-width:1.7}
.elabel{fill:var(--muted); font-size:10px; font-family:var(--mono)}
.elabel-bg{fill:var(--bg); opacity:.9; stroke:var(--line-soft); stroke-width:.75; rx:4}
.grp{fill:rgba(59,169,201,.05); stroke:var(--steel); stroke-width:1.2; stroke-dasharray:5 5; rx:16}
.grpLabel{fill:var(--steel); font-size:11px; font-family:var(--mono); letter-spacing:.05em; text-transform:uppercase}

.mapctl{position:absolute; left:14px; bottom:14px; display:flex; gap:7px; z-index:4}
.mapctl button{
  background:var(--surface); border:1px solid var(--line); color:var(--text);
  padding:6px 12px; border-radius:8px; cursor:pointer; font-size:11.5px; font-weight:600;
  box-shadow:0 4px 12px var(--shadow);
}
.mapctl button:hover{border-color:var(--red); color:var(--red)}
.legend{
  position:absolute; left:14px; top:14px; z-index:4;
  background:rgba(20,15,16,.82); backdrop-filter:blur(3px);
  border:1px solid var(--line); border-radius:11px; padding:9px 11px;
  display:flex; flex-direction:column; gap:5px; max-width:230px;
}
.legend .lgttl{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:2px}
.pill{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted)}
.hint{
  position:absolute; right:14px; bottom:14px; z-index:4;
  font-family:var(--mono); font-size:10.5px; color:var(--faint);
  background:rgba(20,15,16,.7); border:1px solid var(--line-soft); border-radius:8px; padding:5px 9px;
}

/* ---------- text view ---------- */
.textWrap{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; padding:26px 24px 90px}
.textWrap::-webkit-scrollbar{width:11px}
.textWrap::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:11px}
.doc{max-width:1080px; margin:0 auto}
.lede{color:var(--muted); font-size:14px; line-height:1.62; max-width:70ch; margin:0 0 22px}
.lede strong{color:var(--text); font-weight:650}

.doc-section{
  border:1px solid var(--line); border-radius:16px;
  background:linear-gradient(180deg,var(--surface),#141011);
  padding:18px 18px 20px; margin-bottom:18px;
}
.ds-head{margin-bottom:14px}
.ds-head h3{font-size:15px}
.ds-head .ds-sub{color:var(--muted); font-size:12px; margin-top:4px; max-width:74ch}
.eyebrow-s{font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--red); display:block; margin-bottom:5px}

.cardgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:12px}
.card{
  border:1px solid var(--line); border-radius:13px; background:var(--surface-2);
  padding:12px 13px; min-width:0;
}
.card.wide{grid-column:1/-1}
.ct{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.clabel{font-family:var(--mono); font-size:12.5px; font-weight:650; color:var(--text)}
.kindtag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); border:1px solid var(--line); border-radius:20px; padding:1px 8px; margin-left:auto;
}
.sum{color:var(--muted); font-size:12px; margin-top:7px; line-height:1.55}
.sum b{color:var(--text); font-weight:600}
.row{margin-top:9px; display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.row .lbl{font-family:var(--mono); font-size:10px; color:var(--faint); text-transform:uppercase; letter-spacing:.06em}
.flag{
  font-family:var(--mono); font-size:10px; padding:2px 8px; border-radius:20px; border:1px solid;
}
.flag.gate{color:var(--gold); border-color:rgba(224,168,74,.5); background:rgba(224,168,74,.08)}
.flag.loop{color:var(--violet); border-color:rgba(179,156,240,.5); background:rgba(179,156,240,.08)}
.flag.gated{color:var(--faint); border-color:var(--line); background:rgba(126,112,116,.08)}
.flag.emit{color:var(--green); border-color:rgba(63,185,138,.5); background:rgba(63,185,138,.08)}

.chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.chip{
  font-family:var(--mono); font-size:11px; color:var(--text);
  background:var(--surface-3); border:1px solid var(--line); border-radius:7px; padding:3px 9px;
}
.chip.mut{color:var(--muted)}
.grouplbl{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); margin:12px 0 2px; display:block}
.grouplbl.write{color:var(--red)} .grouplbl.curate{color:var(--steel)} .grouplbl.operate{color:var(--green)} .grouplbl.brain{color:var(--violet)}

.jsonbox{
  background:#0b0809; border:1px solid var(--line); border-radius:11px;
  padding:13px 14px; overflow-x:auto; margin:12px 0 2px;
  font-family:var(--mono); font-size:12px; line-height:1.6; color:var(--text);
}
.jsonbox code{font-family:inherit}
.jsonbox .k{color:var(--steel)}
.jsonbox .s{color:var(--gold)}
.jsonbox .n{color:var(--violet)}
.jsonbox .b{color:var(--red)}

.tree{
  font-family:var(--mono); font-size:12px; line-height:1.7;
  background:#0b0809; border:1px solid var(--line); border-radius:11px;
  padding:14px 15px; overflow-x:auto;
}
.trow{white-space:pre}
.trow .tname{color:var(--text)}
.trow .tdir{color:var(--steel); font-weight:600}
.trow .tfile{color:var(--gold)}
.trow .tguide{color:var(--faint)}
.trow .tcom{color:var(--faint)}

.overviewGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:13px}
a.ocard{
  display:flex; flex-direction:column; gap:6px; text-decoration:none;
  border:1px solid var(--line); border-radius:14px; background:var(--surface-2);
  padding:14px 15px; color:var(--text);
}
a.ocard:hover{border-color:var(--red); text-decoration:none; transform:translateY(-1px); background:var(--surface-3)}
a.ocard{transition:transform .15s ease, border-color .15s ease, background .15s ease}
.ocard .otop{display:flex; align-items:center; gap:9px}
.ocard .otitle{font-size:13.5px; font-weight:650}
.ocard .odesc{color:var(--muted); font-size:11.5px; line-height:1.5}
.ocard .ogo{font-family:var(--mono); font-size:10px; color:var(--red); letter-spacing:.08em; text-transform:uppercase; margin-top:2px}

.callout{
  border:1px solid var(--line); border-left:3px solid var(--red); border-radius:10px;
  background:rgba(255,59,95,.05); padding:11px 13px; color:var(--muted); font-size:12px; margin-top:12px;
}
.callout b{color:var(--text)}

/* ---------- node detail (full-screen) ---------- */
.stepWrap{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; padding:26px 24px 90px}
.stepWrap::-webkit-scrollbar{width:11px}
.stepWrap::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:11px}
.stepDetail{max-width:1080px; margin:0 auto}
.stepDetail code{font-family:var(--mono); font-size:11.5px; background:var(--surface-3); border:1px solid var(--line); border-radius:5px; padding:1px 5px; color:var(--text)}
.stepHead{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px}
.stepBack{
  background:var(--surface); border:1px solid var(--line); color:var(--text);
  padding:8px 14px; border-radius:9px; cursor:pointer; font-size:12px; font-weight:600;
  box-shadow:0 4px 12px var(--shadow); flex:0 0 auto;
}
.stepBack:hover{border-color:var(--red); color:var(--red)}
.stepHeadText{display:flex; flex-direction:column; gap:3px; min-width:0; flex:1 1 240px}
.stepEyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
.stepTitle{font-size:20px; line-height:1.2}
.stepPill{
  font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  border:1px solid; border-radius:20px; padding:3px 11px; flex:0 0 auto; white-space:nowrap;
  background:rgba(255,255,255,.03);
}
.stepNav{display:flex; gap:9px; flex-wrap:wrap; margin-bottom:18px}
.stepChip{
  display:inline-flex; align-items:center; gap:8px; max-width:100%; min-width:0;
  background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
  color:var(--text); padding:8px 12px; cursor:pointer; font-size:12px;
}
.stepChip:hover{border-color:var(--red)}
.stepChip .scDir{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.stepChip .scId{font-family:var(--mono); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.stepChip.disabled{cursor:default; color:var(--faint); opacity:.75}
.stepChip.disabled:hover{border-color:var(--line)}
.stepProse{color:var(--muted); font-size:13px; line-height:1.68; max-width:78ch; margin:0}
.stepProse b, .stepList b{color:var(--text); font-weight:600}
.stepList{margin:6px 0 0; padding-left:20px; color:var(--muted); font-size:12.5px; line-height:1.62}
.stepList li{margin-bottom:8px}
.gateSection{border-left:3px solid var(--gold)}
.stepWalk{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--muted)}
.chip.cur{background:var(--red); color:#1a0308; border-color:var(--red); font-weight:650}
.openStepBtn{
  background:var(--surface-3); border:1px solid var(--line); color:var(--red);
  padding:5px 12px; border-radius:8px; cursor:pointer; font-size:11px; font-weight:650;
  font-family:var(--mono);
}
.openStepBtn:hover{border-color:var(--red); background:var(--surface-2)}

/* ---------- responsive ---------- */
@media (max-width:820px){
  body{overflow:auto}
  #app{grid-template-columns:1fr; grid-template-rows:auto 1fr; position:fixed; inset:0}
  #nav{border-right:0; border-bottom:1px solid var(--line); max-height:44vh}
  .brand{padding:14px 16px 10px}
  .navlist{max-height:none}
  .topbar{padding:11px 14px}
  .textWrap{padding:18px 14px 80px}
  .stepWrap{padding:18px 14px 80px}
  .stepHead{gap:10px}
  .stepTitle{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important; animation:none!important; scroll-behavior:auto!important}
  a.ocard:hover{transform:none}
}
</style>
</head>
<body>
<div id="app">
  <aside id="nav" aria-label="Sections">
    <div class="brand">
      <div class="eyebrow">CENSURADO</div>
      <h1>Newsroom Docs</h1>
      <div class="subtitle">The agentic recipe of a self-hosted AI newsroom.</div>
    </div>
    <nav class="navlist" id="navlist" aria-label="Section navigation"></nav>
    <div class="navfoot">Built from the live recipe.</div>
  </aside>

  <main id="main">
    <header class="topbar">
      <div class="crumb">
        <h2 id="crumbTitle">Overview</h2>
        <div class="crumbSub" id="crumbSub"></div>
      </div>
      <div class="modeToggle" role="tablist" aria-label="View mode">
        <button class="segbtn" id="mMap" role="tab" aria-selected="false">Map</button>
        <button class="segbtn active" id="mText" role="tab" aria-selected="true">Text</button>
      </div>
    </header>
    <section id="stage" aria-live="polite"></section>
  </main>
</div>

<script>
"use strict";
(function(){
  var NODE_W=200, NODE_H=64;
  var LANE={red:'var(--red)',steel:'var(--steel)',gold:'var(--gold)',green:'var(--green)',violet:'var(--violet)',faint:'var(--faint)'};
  var EDGE={
    flow:{stroke:'var(--muted)',dash:'',m:'m-muted'},
    pass:{stroke:'var(--green)',dash:'',m:'m-green'},
    loop:{stroke:'var(--violet)',dash:'',m:'m-violet'},
    gated:{stroke:'var(--faint)',dash:'6 5',m:'m-faint'},
    seam:{stroke:'var(--steel)',dash:'6 5',m:'m-steel'},
    media:{stroke:'var(--gold)',dash:'4 4',m:'m-gold'}
  };

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function hl(str){
    return esc(str).replace(/("(?:\\.|[^"\\])*"(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?)/g, function(m){
      var cls='n';
      if(m.charAt(0)==='"'){ cls = /:\s*$/.test(m)?'k':'s'; }
      else if(/^(true|false|null)$/.test(m)) cls='b';
      return '<span class="'+cls+'">'+m+'</span>';
    });
  }

  /* ---------- text builders ---------- */
  var el={
    card:function(o){
      return '<div class="card'+(o.wide?' wide':'')+'"'+(o.id?(' id="'+o.id+'"'):'')+'>'
        +'<div class="ct"><span class="dot" style="background:'+(o.color||'var(--red)')+'"></span>'
        +'<span class="clabel">'+o.label+'</span>'+(o.tag?('<span class="kindtag">'+o.tag+'</span>'):'')+'</div>'
        +(o.sum?('<div class="sum">'+o.sum+'</div>'):'')
        +(o.extra||'')+'</div>';
    },
    chips:function(arr,mut){return '<div class="chips">'+arr.map(function(c){return '<span class="chip'+(mut?' mut':'')+'">'+esc(c)+'</span>';}).join('')+'</div>';},
    json:function(s){return '<pre class="jsonbox"><code>'+hl(s)+'</code></pre>';}
  };

  /* =====================================================================
     CONTENT MODEL
     ===================================================================== */

  // Workflow pipeline nodes ------------------------------------------------
  var COL=function(c){return 48+c*236;};
  var WF=[
    {id:'15-pick-author',c:0,y:220,kind:'setup',lane:'steel',
      summary:'Loads the author (voice, bias, assigned sources) from the backend.',
      details:['The node requests the persona from the store: its voice register, its declared bias and the list of outlets it is allowed to name.','Everything downstream is anchored to that author: the topic, the readable sources and the citable outlets.','Source: <a href="https://github.com/hec-ovi/censurado-web-brain/blob/main/prompts/workflow/15-pick-author.md" target="_blank" rel="noopener">prompts/workflow/15-pick-author.md</a>']},
    {id:'20-fresh-titulars',c:1,y:220,kind:'setup',lane:'steel',
      summary:'single-author / authors modes only: picks a fresh, uncovered topic for that author.',
      details:['Present only when the author picks its own topic (single-article receives the topic from outside).','Discards anything already published so stories are not repeated.','Source: <a href="https://github.com/hec-ovi/censurado-web-brain/blob/main/prompts/workflow/20-fresh-titulars.md" target="_blank" rel="noopener">prompts/workflow/20-fresh-titulars.md</a>']},
    {id:'30-research',c:2,y:220,kind:'research',lane:'steel',emits:'ledger.md',
      summary:'Reads the <b>assigned</b> sources of the author (fresh feeds + sitemaps) and uses web search to INFORM facts.',
      details:['Every central fact is validated across at least <code>MIN_SOURCES</code> independent sources from each political leaning: right, neutral and left.','Outlets found through web search are context and are <b>never named</b>: only the assigned outlets of the author and the primary actors are nameable.','Emits <code>ledger.md</code>, the fact record that the gate checks.','Source: <a href="https://github.com/hec-ovi/censurado-web-brain/blob/main/prompts/workflow/30-research.md" target="_blank" rel="noopener">prompts/workflow/30-research.md</a>']},
    {id:'40-outline',c:3,y:220,kind:'structure',lane:'steel',
      summary:'Fixes the angle and the structure before writing.',

  // Richer per-step content, authored from the real prompt files.
  var WF_DETAIL={
    '15-pick-author':{
      name:'Load the author you write as',

    '20-fresh-titulars':{

    '30-research':{

    '40-outline':{

      inputs:['the ledger','the chosen angle'],

    '50-draft':{
      name:'Draft the article in your voice',
      what:'This node writes the full body from the outline and the ledger, in the language and voice of the persona, in the first person, so it reads like that byline and not a generic assistant. One newsroom-wide exception overrides the voice: a piece in the politics section is always written in the THIRD person, with the slant living only in framing, emphasis and source selection. The writer takes a clear position and argues it from the evidence (Censurado manufactures no false balance), but the one hard line holds: the slant lives in the framing, never in the facts, so every claim still traces to a ledger source and every date, figure and name stays exact. It builds the outlined layers, says each idea once (no stacked hedges), and reaches for the rhythm-breaking devices the renderer styles: a <code>&gt; blockquote</code> pull-quote, a short list, a GFM table, a mid-body image, and inline <code>{{tweet}}</code>, <code>{{video}}</code> and <code>{{relacionado}}</code> widgets placed next to the sentence they support. It also strips the AI-slop tells (no em or en dashes, no negation-aphorism, no candor tics, gerunds kept to a minimum).',
      inputs:['the layered outline','the ledger','the persona voice'],
      outputs:['draft.md (the complete first-person body)'],
      gate:'<p class="stepProse">The assigned-sources-only naming rule, with no links in the body:</p><ul class="stepList">'

        +'<li>Name a media outlet only when it is one of the ASSIGNED sources of the author; a web-surfaced outlet is background you never name.</li>'
        +'<li>Attribute a fact from a non-assigned outlet to the primary actor behind the news (the person, company, official, institution or document), or report it with no medium named.</li>'

    '60-evaluate':{
      name:'Evaluate the draft (the publish gate)',
      what:'This node is the publish GATE. The writer steps back and judges its own draft strictly, as a senior editor who did not write it, scoring each of six dimensions PASS or REVISE with a short, specific note on what to fix. The article may not publish while any dimension fails; only a clean sweep of all six carries it forward. A REVISE drops the piece into the respin loop (70-respin), which fixes the flagged items and re-runs this same evaluation. It does not carry a failing draft toward publish.',
      inputs:['draft.md','the ledger','the floors MIN_SOURCES and MIN_PER_TYPE'],
      outputs:['a per-dimension PASS or REVISE verdict','the overall verdict'],
      gate:'<p class="stepProse">Six dimensions, each PASS or REVISE; PASS overall only when all six pass:</p><ol class="stepList">'

        +'<li><b>Accents and orthography.</b> Full accents (á, é, í, ó, ú, ü), the ñ, and the opening marks ¿ and ¡ are present and correct.</li>'

        +'<li><b>Compression and density.</b> Each layer is dense, high information per word, with no coasting.</li>'

    },
    '70-respin':{
      name:'Re-spin: self-revise against the evaluation',
      what:'This node is the self-revision half of the quality loop. The writer revises its own piece, in its own voice, addressing every REVISE note from the evaluation. It gets up to <code>RESPIN_PASSES</code> passes, and each pass keeps every grounded fact and every citation, changing only form, wording and structure. It cuts repetition across sections, drops noise and duplicate sources (two outlets in one group are ONE confirmation), tightens loose wording, and removes every slop tell. After each pass it re-runs <code>60-evaluate</code> and stops the moment the evaluation returns PASS, or when the passes are exhausted, then continues to the next step.',
      inputs:['the failing draft','the per-dimension REVISE notes'],

    '75-factcheck':{
      name:'Fact-check: fix the grounding',
      what:'This node runs plainly, not in a persona voice, because it is grounding and not style; it changes nothing but the grounding. It removes or replaces any citation that is not in the ledger, since the ledger sources are the only ones the article may cite. It converts every body link back to plain-text attribution, resolves every unresolved marker (TODO, FIXME, TK, "citation needed") by grounding the claim or cutting it, keeps every date exactly as the sources have it, and restores any altered proper name to its source spelling. The result is the same article, correctly grounded.',
      inputs:['the passed draft','the ledger','the assigned-source list'],
      outputs:['the same article, correctly grounded'],
      gate:'<ul class="stepList">'
        +'<li>Strip any citation that is not in the ledger, or any named outlet not on the ASSIGNED list of the author, but KEEP its fact.</li>'
        +'<li>Reattribute the kept fact to the primary actor behind the news, or state it plainly with no medium named.</li>'
        +'<li>No links in the body (keep only the text); dates and proper names stay exactly as the sources have them.</li></ul>'
    },
    '80-enrich':{
      name:'Enrich: one plain tightening and proofread pass',
      what:'This node is a single plain (non-persona) copy-editing pass over the near-final article that tightens it without changing its meaning or its claims. It improves clarity, flow and structure, adding a subheading or a short list only where it genuinely helps, and cuts the last repetition, filler and any slop tell the earlier passes missed. It also checks for MONOTONY: if the piece is a flat wall of even paragraphs, it adds the rhythm-breaking devices the material already supports (a pull-quote lifted from the sharpest existing line, a short list, a striking number on its own line, a <code>{{relacionado:}}</code> to a real earlier piece), inventing no new fact. Then it proofreads end to end (spelling, grammar and punctuation, no em or en dash, clean Markdown, each widget marker on its own line) and trims gerunds to a minimum. It adds no citation to a source outside the ledger and shortens only by removing noise, never substance.',
      inputs:['the grounded draft'],

    '85-accents-entities':{

      what:'This node is one focused pass over the whole piece for correct Spanish and correct names; this is where the accents rule lives. It reads the title, the description, the body AND the topic tags, and restores every accent (á, é, í, ó, ú, ü), every ñ, and every opening ¿ or ¡: "economia" becomes "economía", "numero" becomes "número". Keeping an English technical term in English is never a licence to drop a Spanish accent elsewhere. It then confirms every proper-noun entity (people, organizations, places) is spelled as the sources have it, and that each central one is tagged as a lowercase, accented topic (for example <code>javier milei</code>, <code>openai</code>). Those entity tags build each entity topic page over time, so it names the protagonists, not only abstract themes.',
      inputs:['the proofread draft and its topic tags'],

    '90-finalize':{
      name:'Finalize: lift into the publish payload',
      what:'This node lifts the finished article into its publish fields; it is a formatting and titling step, so it does not rewrite the body, add facts or change the angle. It crafts the sharpest honest headline the facts support: a <code>title</code> of NO MORE than 5 words, objective and informative, naming a person only when they are very well known or hold an executive office, and never spliced by a ;, a : or a dash. It writes the <code>description</code> (the bajada), one 20 to 30 word line that does not repeat the words or subject of the title but complements it and sets up the opening line. It carries the complete Markdown <code>body</code> through unchanged, and sets <code>topics</code> (at most <code>TOPIC_CAP</code> sharp theme and entity tags), <code>keywords</code>, and an optional <code>slug</code>.',

    '95-image':{
      name:'Hero image: art-direct it',
      what:'This node is the art-direction step. A tech or AI piece carries a hero image (required there, optional on other beats, since a piece publishes fine text-only or can lean on a video or a quoted tweet). The art is matched to the section and the voice and briefed as an editorial ILLUSTRATION, never a photo, never a real face, never a staged news moment. It is a two-step tool flow, not hand-built: the <code>image</code> verb renders an art-directed FLUX.2 hero, uploads the bytes, and prints the <code>/media/&lt;sha&gt;.png</code> path; ComfyUI must be up on <code>:8188</code> (the GPU box), which only this step needs. Heroes render wide (about 16:9) to fill the hero band. The render saves the hero, and the next preview step attaches it.',
      code:'python3 cli/censurado.py image --prompt "&lt;subject &rarr; action &rarr; style &rarr; context&gt;" --alt "&lt;one-line Spanish alt&gt;"',

    '99-preview':{

    'publicar':{

  var wfEdges=[

  function wfText(){
    var cards=WF.map(function(n){

  // Universal, geometry-driven edge router used by EVERY section.
  // It picks A's exit port and B's entry port on the sides that face each
  // other (horizontal when |dx|>=|dy|, else vertical), then draws a cubic
  // bezier that leaves A and arrives at B perpendicular to those faces.
  // The path's first point sits exactly on A's boundary and its last point
  // on B's boundary, so the marker-end arrowhead lands on B's face.
  // `off` shifts the ports along the chosen side (fraction of the side
  // length) so a bidirectional pair (e.g. 60-evaluate <-> 70-respin) draws
  // as two separated arcs instead of one overlapping corridor.
  var BIDIR_OFF=0.26;
  function fmt(v){ return Math.round(v*100)/100; }
  function edgeGeom(a,b,off){
    off=off||0;
    var wa=a.w||NODE_W, ha=a.h||NODE_H, wb=b.w||NODE_W, hb=b.h||NODE_H;
    var acx=a.x+wa/2, acy=a.y+ha/2, bcx=b.x+wb/2, bcy=b.y+hb/2;
    var dx=bcx-acx, dy=bcy-acy;
    var K=0.42, MIN=42;
    var sx,sy,ex,ey,c1x,c1y,c2x,c2y;
    if(Math.abs(dx)>=Math.abs(dy)){
      var right=dx>=0;
      sx=right?a.x+wa:a.x;   ex=right?b.x:b.x+wb;
      sy=acy+off*ha;         ey=bcy+off*hb;
      var cd=Math.max(MIN,Math.abs(ex-sx)*K), sg=right?1:-1;
      c1x=sx+sg*cd; c1y=sy;  c2x=ex-sg*cd; c2y=ey;
    } else {
      var down=dy>=0;
      sy=down?a.y+ha:a.y;    ey=down?b.y:b.y+hb;
      sx=acx+off*wa;         ex=bcx+off*wb;
      var cd2=Math.max(MIN,Math.abs(ey-sy)*K), sg2=down?1:-1;
      c1x=sx; c1y=sy+sg2*cd2; c2x=ex; c2y=ey-sg2*cd2;
    }
    return {sx:sx,sy:sy,ex:ex,ey:ey,c1x:c1x,c1y:c1y,c2x:c2x,c2y:c2y};
  }
  function edgePath(g){
    return 'M'+fmt(g.sx)+','+fmt(g.sy)+' C'+fmt(g.c1x)+','+fmt(g.c1y)+' '+fmt(g.c2x)+','+fmt(g.c2y)+' '+fmt(g.ex)+','+fmt(g.ey);
  }
  function bezMid(g){
    return {x:0.125*g.sx+0.375*g.c1x+0.375*g.c2x+0.125*g.ex,
            y:0.125*g.sy+0.375*g.c1y+0.375*g.c2y+0.125*g.ey};
  }

    var groupsSvg=(data.groups||[]).map(function(g){

    var edgeSet={};
    data.edges.forEach(function(e){ edgeSet[e.from+'␀'+e.to]=true; });
    var edgesSvg=data.edges.map(function(e){
      var a=nodeById(sec,e.from), b=nodeById(sec,e.to);
      if(!a||!b) return '';
      var cfg=EDGE[e.type||'flow']||EDGE.flow;
      var off=0;
      if(edgeSet[e.to+'␀'+e.from]){ off=(String(e.from)<String(e.to))?BIDIR_OFF:-BIDIR_OFF; }
      var g=edgeGeom(a,b,off);
      var d=edgePath(g);
      var path='<path class="edge" data-from="'+esc(e.from)+'" data-to="'+esc(e.to)+'" d="'+d+'" style="stroke:'+cfg.stroke+(cfg.dash?';stroke-dasharray:'+cfg.dash:'')+'" marker-end="url(#'+cfg.m+')"></path>';
      var lbl='';
      if(e.label){
        var m=bezMid(g);
        var tw=e.label.length*6.1+10;
        lbl='<g transform="translate('+fmt(m.x)+','+fmt(m.y)+')"><rect class="elabel-bg" x="'+(-tw/2)+'" y="-9" width="'+tw+'" height="16" rx="4"></rect>'
          +'<text class="elabel" x="0" y="2" text-anchor="middle">'+esc(e.label)+'</text></g>';
      }
      return path+lbl;
    }).join('');

    var nodesSvg=data.nodes.map(function(n){
      var w=n.w||NODE_W, h=n.h||NODE_H;
      var label=n.label||n.id;
      return '<g class="node lane-'+n.lane+'" data-id="'+esc(n.id)+'" tabindex="0" role="button" aria-label="'+esc(label)+'" transform="translate('+n.x+','+n.y+')">'
        +'<rect class="nbox" width="'+w+'" height="'+h+'" rx="12"></rect>'
        +'<rect x="0" y="0" width="6" height="'+h+'" rx="3" style="fill:'+LANE[n.lane]+'"></rect>'
        +'<text class="nlabel" x="18" y="27">'+esc(label)+'</text>'
        +'<text class="nkind" x="18" y="46" style="fill:'+LANE[n.lane]+'">'+esc(n.kind||'')+'</text>'
        +'</g>';
    }).join('');

    stage.innerHTML=
      '<div class="mapWrap">'
      +'<svg id="atlas" role="img" aria-label="Map of '+esc(sec.label)+'">'
      +markerDefs()
      +'<g id="viewport">'+groupsSvg+edgesSvg+nodesSvg+'</g>'
      +'</svg></div>'
      +'<div class="legend"><div class="lgttl">Legend</div>'+legend+'</div>'
      +'<div class="mapctl"><button type="button" id="btnFit">Fit</button><button type="button" id="btnReset">Reset</button></div>'
      +'<div class="hint">drag to move &middot; wheel to zoom</div>';

    wireMap(sec);
  }

  var view={tx:40,ty:40,k:1};
  function wireMap(sec){
    var svg=document.getElementById('atlas');
    var vp=document.getElementById('viewport');
    if(!svg||!vp) return;

    function apply(){ vp.setAttribute('transform','translate('+view.tx+','+view.ty+') scale('+view.k+')'); }
    function bbox(){
      var ns=sec.map.nodes, gs=sec.map.groups||[];
      var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
      ns.forEach(function(n){ var w=n.w||NODE_W,h=n.h||NODE_H; minx=Math.min(minx,n.x); miny=Math.min(miny,n.y); maxx=Math.max(maxx,n.x+w); maxy=Math.max(maxy,n.y+h); });
      gs.forEach(function(g){ minx=Math.min(minx,g.x); miny=Math.min(miny,g.y); maxx=Math.max(maxx,g.x+g.w); maxy=Math.max(maxy,g.y+g.h); });
      return {minx:minx,miny:miny,maxx:maxx,maxy:maxy};
    }
    function fit(){
      var bb=bbox(); var pad=54;
      var bw=(bb.maxx-bb.minx)+pad*2, bh=(bb.maxy-bb.miny)+pad*2;
      var sw=stage.clientWidth||900, sh=stage.clientHeight||600;
      var k=Math.min(sw/bw, sh/bh, 1.15); if(!isFinite(k)||k<=0) k=1;
      view.k=k;
      view.tx=(sw-bw*k)/2 - (bb.minx-pad)*k;
      view.ty=(sh-bh*k)/2 - (bb.miny-pad)*k;
      apply();
    }
    function reset(){ view.k=1; view.tx=40; view.ty=36; apply(); }

    var fitBtn=document.getElementById('btnFit'), resetBtn=document.getElementById('btnReset');
    if(fitBtn) fitBtn.addEventListener('click',fit);
    if(resetBtn) resetBtn.addEventListener('click',reset);

    // pan
    var dragging=false, moved=false, sx=0, sy=0, otx=0, oty=0;
    svg.addEventListener('pointerdown',function(e){
      if(e.target.closest('.node')) return;
      dragging=true; moved=false; sx=e.clientX; sy=e.clientY; otx=view.tx; oty=view.ty;
      svg.classList.add('grabbing');
      try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    });
    svg.addEventListener('pointermove',function(e){
      if(!dragging) return;
      var dx=e.clientX-sx, dy=e.clientY-sy;
      if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
      view.tx=otx+dx; view.ty=oty+dy; apply();
    });
    function endDrag(e){ dragging=false; svg.classList.remove('grabbing'); if(e){ try{ svg.releasePointerCapture(e.pointerId); }catch(_){} } }
    svg.addEventListener('pointerup',endDrag);
    svg.addEventListener('pointercancel',endDrag);
    svg.addEventListener('pointerleave',function(e){ if(dragging) endDrag(e); });

    // zoom
    svg.addEventListener('wheel',function(e){
      e.preventDefault();
      var rect=svg.getBoundingClientRect();
      var mx=e.clientX-rect.left, my=e.clientY-rect.top;
      var factor=e.deltaY<0?1.12:1/1.12;
      var nk=Math.max(0.28,Math.min(2.6,view.k*factor));
      view.tx=mx-(mx-view.tx)*(nk/view.k);
      view.ty=my-(my-view.ty)*(nk/view.k);
      view.k=nk; apply();
    },{passive:false});

    // node interactions
    var nodeEls=svg.querySelectorAll('.node');
    for(var i=0;i<nodeEls.length;i++){
      (function(g){
        var id=g.getAttribute('data-id');
        g.addEventListener('click',function(){ if(moved) return; var n=nodeById(sec,id); if(n) openNodeDetail(n,sec); });
        g.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); var n=nodeById(sec,id); if(n) openNodeDetail(n,sec); } });
      })(nodeEls[i]);
    }

    requestAnimationFrame(fit);
  }

  /* ---------- node detail (full-screen, section-aware) ----------
     One mechanism for EVERY section. A node click opens a full-screen
     detail with an explicit "Back to <Section>" control that returns to
     that section's current overview (its Map or Text), the section still
     selected in the nav and the breadcrumb still on it. Workflow keeps its
     rich What / Inputs / Outputs / gate / Prev-Next content; other sections
     render from the node's own summary + details (which carry the Source
     link). Escape and the topbar Map/Text toggle also return to the
     overview, and selecting another section always lands on its overview. */
  function wfIndex(id){ for(var i=0;i<WF.length;i++){ if(WF[i].id===id) return i; } return -1; }
  function wfById(id){ var i=wfIndex(id); return i>=0?WF[i]:null; }
  function gateLabelFor(node){
    if(node.id==='60-evaluate'||node.id==='publicar') return 'The gate';
    if(node.id==='70-respin') return 'The loop';
    return 'The rule';
  }
  function exitDetail(){ state.step=null; renderStage(); }
  function stepChip(dir,node){
    return '<button type="button" class="stepChip '+dir+'" data-step="'+esc(node.id)+'" aria-label="'+(dir==='prev'?'Previous':'Next')+' step '+esc(node.id)+'">'
      +(dir==='prev'?'<span class="scDir">&lsaquo; Prev</span>':'')
      +'<span class="scId">'+esc(node.id)+'</span>'
      +(dir==='next'?'<span class="scDir">Next &rsaquo;</span>':'')
      +'</button>';
  }
  function workflowStepBody(node,laneColor){
    var i=wfIndex(node.id);
    var prev=i>0?WF[i-1]:null;
    var next=(i>=0&&i<WF.length-1)?WF[i+1]:null;
    var glabel=gateLabelFor(node);
    var nav='<div class="stepNav" aria-label="Adjacent steps">'
      +(prev?stepChip('prev',prev):'<span class="stepChip disabled">Start of the walk</span>')
      +(next?stepChip('next',next):'<span class="stepChip disabled">End of the walk</span>')
      +'</div>';
    var what='<div class="doc-section"><div class="ds-head"><span class="eyebrow-s">What it does</span><h3>'+esc(node.name||node.id)+'</h3></div>'
      +'<p class="stepProse">'+(node.what||node.summary||'')+'</p>'
      +(node.code?('<pre class="jsonbox"><code>'+node.code+'</code></pre>'):'')
      +'</div>';
    var io='<div class="doc-section"><div class="ds-head"><h3>Inputs and outputs</h3></div><div class="cardgrid">'
      +el.card({label:'Inputs',tag:'consumes',color:laneColor,extra:(node.inputs&&node.inputs.length?el.chips(node.inputs,true):'<div class="sum">None; it opens the walk.</div>')})
      +el.card({label:'Outputs',tag:'produces',color:laneColor,extra:(node.outputs&&node.outputs.length?el.chips(node.outputs):'<div class="sum">No new artifact.</div>')})
      +'</div></div>';
    var gate=node.gate?('<div class="doc-section gateSection"><div class="ds-head"><h3>'+esc(glabel)+'</h3></div>'+node.gate+'</div>'):'';
    var walk='<div class="stepWalk">'
      +(prev?'<span class="chip mut">'+esc(prev.id)+'</span>':'<span class="chip mut">start</span>')
      +' &rarr; <span class="chip cur">'+esc(node.id)+'</span> &rarr; '
      +(next?'<span class="chip mut">'+esc(next.id)+'</span>':'<span class="chip mut">end</span>')
      +'</div>';
    var sits='<div class="doc-section"><div class="ds-head"><h3>Where it sits</h3></div>'
      +walk
      +'<div class="row"><span class="lbl">modes</span></div>'
      +el.chips(node.modes&&node.modes.length?node.modes:['(standalone)'],true)
      +'</div>';
    var src='<div class="callout">Source: <a href="https://github.com/hec-ovi/censurado-web-brain/blob/main/prompts/workflow/'+esc(node.id)+'.md" target="_blank" rel="noopener">prompts/workflow/'+esc(node.id)+'.md</a></div>';
    return nav+what+io+gate+sits+src;
  }
  function genericNodeBody(node){
    var sum='<div class="doc-section"><div class="ds-head"><span class="eyebrow-s">Summary</span><h3>'+esc(node.label||node.id)+'</h3></div>'
      +'<p class="stepProse">'+(node.summary||'')+'</p></div>';
    var det='';
    if(node.details&&node.details.length){
      det='<div class="doc-section"><div class="ds-head"><h3>Details</h3></div>'
        +'<ul class="stepList">'+node.details.map(function(d){return '<li>'+d+'</li>';}).join('')+'</ul></div>';
    }
    return sum+det;
  }
  function openNodeDetail(node,sec){
    if(!node||!stage||!sec) return;
    state.step=node.id;
    var laneColor=LANE[node.lane]||'var(--red)';
    var isWf=(sec.id==='workflow');
    var head='<div class="stepHead">'
      +'<button type="button" class="stepBack" aria-label="Back to '+esc(sec.label)+'">&larr; Back to '+esc(sec.label)+'</button>'
      +'<div class="stepHeadText"><span class="stepEyebrow">'+esc(isWf?node.id:sec.label)+'</span>'
      +'<h2 class="stepTitle">'+esc(isWf?(node.name||node.id):(node.label||node.id))+'</h2></div>'
      +'<span class="stepPill" style="color:'+laneColor+';border-color:'+laneColor+'">'+esc(node.kind||'')+'</span>'
      +'</div>';
    var body=isWf?workflowStepBody(node,laneColor):genericNodeBody(node);
    stage.innerHTML='<div class="stepWrap"><div class="stepDetail" role="region" aria-label="Detail '+esc(node.id)+'">'
      +head+body+'</div></div>';

    var back=stage.querySelector('.stepBack');
    if(back) back.addEventListener('click',exitDetail);
    var chips=stage.querySelectorAll('.stepChip[data-step]');
    for(var j=0;j<chips.length;j++){
      (function(b){ b.addEventListener('click',function(){ var t=wfById(b.getAttribute('data-step')); if(t) openNodeDetail(t,sec); }); })(chips[j]);
    }
    if(back){ try{ back.focus({preventScroll:true}); }catch(_){ back.focus(); } }
  }

  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    if(stage && stage.querySelector('.stepDetail')){ exitDetail(); }
  });

  /* ---------- resize: refit map ---------- */
  var rt=null;
  window.addEventListener('resize',function(){
    if(state.mode!=='map') return;
    if(rt) clearTimeout(rt);
    rt=setTimeout(function(){ var b=document.getElementById('btnFit'); if(b) b.click(); },160);
  });

  /* ---------- init ---------- */
  buildNav();
  selectSection('overview');
})();
</script>
</body>
