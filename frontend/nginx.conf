server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version, and cap request bodies (the API
    # payloads here are small JSON documents).
    server_tokens off;
    client_max_body_size 256k;

    # This console has NO auth of its own. Serve it on an internal network only,
    # or put an auth layer (basic-auth or auth_request) in front of both `/` and
    # `/api/` before exposing it. The API it proxies to has state-changing POSTs.

    # The static console. Unknown paths fall back to index.html so the app keeps
    # working if a deep link is ever added. The CSP allows only same-origin
    # scripts (the app is buildless ES modules, no inline script), which is why
    # the page boots from an external bootstrap.js rather than an inline script.
    location / {
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the brain API. The /api prefix is stripped by the trailing
    # slash on proxy_pass, so the browser makes same-origin relative calls
    # (/api/personas -> brain /personas) and no CORS is involved. The upstream
    # host "brain" is the compose service name; the port is uvicorn's default.
    location /api/ {
        proxy_pass http://brain:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
